/* Tema único claro (decisión de marca). Layout: encabezado claro con logo azul, luego dos columnas (entrada | resultado) que se apilan en móvil */
:root{
  --bitt:#113CBB; --sky:#2EBDEF; --sun:#EFC050; --cream:#F0E4CA;
  --bg:#E6F1FD; --surface:#FFFFFF; --surface-2:#F1F6FE; --line:#D2E1F6;

  --good:#11804A; --good-soft:#DDF3E7; --warn:#9A6300; --warn-soft:#FBEFD4; --bad:#C2342B; --bad-soft:#FBE2E0;
  color-scheme:light;
  --display:"DM Sans",ui-sans-serif,system-ui,sans-serif; --mono:"DM Mono",ui-monospace,Consolas,monospace;
}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}

    'designed','developed','led','built','created','implemented','reduced','increased','improved','managed','analyzed','analysed','automated','launched','founded','co-founded','delivered','engineered','prototyped','validated','tested','modeled','modelled','trained','taught','mentored','coordinated','organized','optimized','achieved','won','published','presented','wrote','programmed','coded','directed','established','integrated','deployed','fabricated','assembled','characterized','simulated','negotiated','raised','scaled','streamlined','spearheaded','supervised','conducted','performed','executed','planned','researched','authored','calibrated','installed','generated','secured'];
  const WEAK = ['particip','ayud','apoy','colabore en','encargad','responsable de','estuve','tuve','hice','fui','realice','helped','assisted','worked on','responsible for','involved in','participated','supported'];
  const CLICHES = ['proactiv','trabajo en equipo','responsable','comprometid','orientad[oa] a resultados','apasionad','dinamic','capacidad de liderazgo','buenas relaciones','relaciones interpersonales','facil aprendizaje','rapido aprendizaje','autodidacta','perfeccionista','multitarea','excelente comunicacion','habilidades blandas','persona integra','creativ','resilient','team player','hard[- ]working','detail[- ]oriented','self[- ]motivated','results[- ]driven','passionate','motivated','go[- ]getter','think outside the box','fast learner'];
  const STOP = new Set(norm('a al algo algunos ante antes como con contra cual cuando de del desde donde durante e el ella ellos en entre era es esa ese eso esta este esto estos fue ha hasta hay la las le les lo los mas me mi mis muy no nos o otra otro para pero por porque que quien se sea segun ser si sin sobre su sus tambien te tiene todo tu un una uno unos y ya the and for with from that this you your our are will have has can able must years year experience experiencia trabajo trabajar buscamos requisitos funciones cargo empresa perfil persona deseable conocimiento conocimientos manejo nivel minimo años ano anos area areas equipo responsabilidades ofrecemos candidato candidata estudiante estudiantes profesional practicante practica pasantia sera seran debe deberá contar tener our we an of to in on as or be is at by it its who what about within across including include etc otros otras cada parte mediante asi donde cuales tales hacia muy bien nuevo nueva nuevos nuevas mejor gran grandes vacante oferta aplicar aplica job role team work strong skills skill knowledge using use based apoyar apoyo bajo ingenieria ingeniero ingeniera biomedica biomedico mecanica mecanico dispositivos dispositivo medicos medico electronica sistemas industrial carrera carreras afines afin titulo semestre semestres intermedio avanzado basico deseable minimo horas tiempo completo medio lugar bogota colombia salario contrato engineering engineer biomedical mechanical degree student students intern internship preferred required plus').split(/\s+/));
  const ROLES = [
    {id:'id', name:'I+D de dispositivos médicos', kw:['solidworks','cad','prototipo','prototype','iso 13485','diseno','design','verificacion','verification','validacion','validation','impresion 3d','3d printing','ansys','elementos finitos','fea','requisitos','requirements','pruebas','testing','manufactura','manufacturing','biomateriales','cateter','dispositivo medico','medical device','design control','iso 14971','riesgo','matlab','arduino','pcb']},
    {id:'qa', name:'Calidad y asuntos regulatorios', kw:['iso 13485','iso 14971','invima','fda','capa','auditoria','audit','documentacion','gmp','bpm','regulatorio','regulatory','calidad','quality','registro sanitario','validacion','sop','trazabilidad','no conformidad','21 cfr','mdr','tecnovigilancia','riesgo']},
    {id:'data', name:'Datos e IA en salud', kw:['python','sql',' r ','machine learning','aprendizaje automatico','deep learning','pandas','scikit-learn','tensorflow','pytorch','estadistica','statistics','visualizacion','power bi','tableau','etl','git','modelos','nlp','imagenes medicas','medical imaging','bioinformatica','dashboard','ia ','inteligencia artificial']},
    {id:'clin', name:'Ingeniería clínica y hospitalaria', kw:['mantenimiento','maintenance','equipos biomedicos','gestion de tecnologia','metrologia','calibracion','inventario','hospital','clinica','capacitacion','tecnovigilancia','invima','soporte tecnico','electrofisiologia','instalacion','normativa','ingenieria clinica','clinical engineering','field']},
    {id:'inv', name:'Investigación y biología computacional', kw:['investigacion','research','laboratorio','publicacion','articulo','paper','cultivos celulares','cell culture','pcr','secuenciacion','bioinformatica','python',' r ','estadistica','protocolo','analisis de datos','genomica','marcadores','poster','congreso','biologia computacional']},
    {id:'emp', name:'Emprendimiento e innovación', kw:['prototipo','biodesign','validacion con usuarios','mvp','design thinking','emprendimiento','startup','pitch','modelo de negocio','lean','entrevistas','necesidades clinicas','gestion de proyectos','project management','propiedad intelectual','innovacion','semillero','bitt']}
  ];
  const GENERAL = ['excel','power bi','tableau','python','sql',' r ','matlab','java','javascript','html','git','solidworks','autocad','fusion 360','inventor','ansys','arduino','raspberry','impresion 3d','corte laser','labview','sap','salesforce','hubspot','google analytics','canva','figma','adobe','photoshop','illustrator','office','word','powerpoint','google workspace','notion','jira','trello','scrum','agile','lean','six sigma','design thinking','gestion de proyectos','project management','pmp','ingles','english','frances','aleman','portugues','b2','c1','toefl','ielts','estadistica','spss','stata','machine learning','docker','aws','azure','linux','contabilidad','finanzas','marketing','ventas','servicio al cliente','investigacion','redaccion','fotografia','edicion de video'];
  const SECTIONS = [
    {k:'Experiencia', re:/\b(experiencia|experience|practicas?|pasantias?)\b/},
    {k:'Educación', re:/\b(educacion|education|formacion academica)\b/},
    {k:'Habilidades', re:/\b(habilidades|skills|aptitudes|competencias|herramientas)\b/},
    {k:'Proyectos', re:/\b(proyectos|projects)\b/},
    {k:'Idiomas', re:/\b(idiomas|languages|ingles|english)\b/},
  ];

  const lines = t => (t||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const stripBullet = l => l.replace(/^[\-•●▪◦*·•▪►>–—\d\.\)\s]+/,'').trim();
  const firstWord = l => norm(stripBullet(l)).split(/[\s,:;]+/)[0]||'';
  const isStrong = l => { const w=firstWord(l); return w.length>2 && STRONG.some(s=>w.startsWith(s)); };
  const isWeak = l => { const n=norm(stripBullet(l)); return WEAK.some(s=>n.startsWith(s)); };
  const yearRe = /^(19|20)\d{2}$/;
  function hasMetric(l){
    const n=norm(l);
    if(/%|\$|\busd\b|\bcop\b|\bx\d|\d+x\b|\bk\b|millones|mil\b/.test(n) && /\d/.test(n)) return true;
    const nums=(n.match(/\d+(?:[.,]\d+)?/g)||[]).filter(x=>!yearRe.test(x) && !(x.length>=7));
    // descarta rangos de fecha tipo 01/2024 o "ene 2023"
    const cleaned = n.replace(/\b\d{1,2}\/(19|20)\d{2}\b/g,'');
    const nums2=(cleaned.match(/\d+(?:[.,]\d+)?/g)||[]).filter(x=>!yearRe.test(x) && x.length<7);
    return nums.length>0 && nums2.length>0;
  }
  // líneas que describen logros/actividades (no títulos, no fechas sueltas)
  // une las líneas que el PDF partió a la mitad de una frase
  function mergeWrapped(L){
    const out=[];
    L.forEach(l=>{
      const prev=out[out.length-1];
      const startsBullet=/^[\-•●▪◦*·►–—]/.test(l);
      const startsLower=/^[a-záéíóúñü(]/.test(l);
      const isDate = /\b(19|20)\d{2}\b/.test(l) && /(\(\d+ (años?|meses?|years?|months?)|actualidad|present|\b(19|20)\d{2}\s*[-–]\s*)/i.test(l);
      const prevOpen = prev && !isDate && !/[.:;!?)]$/.test(prev) && (prev.length>70 || /^[\-•●▪◦*·►–—]/.test(prev));
      if(prev && !startsBullet && (startsLower || prevOpen) && !/^(page|p[aá]gina)\s+\d/i.test(l)) out[out.length-1]=prev+' '+l;
      else out.push(l);
    });
    return out.filter(l=>!/^(page|p[aá]gina)\s+\d+\s+(of|de)\s+\d+$/i.test(l));
  }
  function bulletLines(t){
    const L=mergeWrapped(lines(t));
    const headerEnd = L.slice(0,5).some(l=>/@/.test(l)) ? L.findIndex(l=>/@/.test(l))+1 : 0;
    return L.filter((l,i)=>{
      if(i<headerEnd) return false;
      const s=stripBullet(l);
      if(s.length<28) return false;
      const words=s.split(/\s+/).length, commas=(s.match(/,/g)||[]).length;
      if(/\b(19|20)\d{2}\b/.test(s) && words<14) return false;          // títulos de cargo/educación con fechas
      if(words<=6) return false;                                          // ciudades, cargos sueltos
      if(/\(\d+ (años?|meses?|years?|months?)/i.test(s) && words<20) return false; // rangos de fechas de LinkedIn
      if(commas>=3 && words/(commas+1)<3) return false;                   // listas de habilidades
      if(s===s.toUpperCase() && /[A-ZÁÉÍÓÚ]/.test(s)) return false;       // encabezados en mayúscula
      if(/@|https?:|linkedin\.com|github\.com|\+?\d[\d\s\-]{8,}/.test(s)) return false;
      return true;
    });
  }
  function cliches(t){
    const out=[];
    const sentences=(t||'').split(/(?<=[.!?\n])/);
    sentences.forEach(s=>{
      const n=norm(s);
      CLICHES.forEach(c=>{
        const re=new RegExp('\\b'+c,'i');
        const m=n.match(re);
        if(m){
          const cm=(s.match(/,/g)||[]).length, wd=s.trim().split(/\s+/).length;
          const isList = cm>=3 && wd/(cm+1)<3;
          const evidence = !isList && wd>=8 && hasMetric(s.replace(/\b\d+d\b/gi,'')) || /\b(lider|coordin|logr|led|managed|diseñ|disen|desarroll)\w*\b.*\b(\d|equipo de \d)/.test(n);
          out.push({term:pretty(m[0].trim(), s), sentence:s.trim().slice(0,160), evidence});
        }
      });
    });
    // un término por oración
    const seen=new Set(); return out.filter(o=>{const k=o.term+'|'+o.sentence; if(seen.has(k))return false; seen.add(k); return true;});
  }
  // normaliza carácter por carácter para que los índices coincidan con el texto original
  const normAligned = s => [...(s||'')].map(ch=>{const x=norm(ch); return x.length===1?x:ch.toLowerCase().slice(0,1)||' ';}).join('');
  function pretty(k, src){
    const orig=[...(src||'')]; const n=normAligned(src);
    const re=new RegExp('(^|[^a-z0-9])('+k.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','');
    const m=n.match(re); if(!m) return k.trim();
    let a=m.index+m[1].length, b=a+m[2].length;
    while(b<orig.length && /[\p{L}\d]/u.test(orig[b])) b++;
    return orig.slice(a,b).join('');
  }
  function vacancyKeywords(v){
    const n=' '+norm(v)+' ';
    const set=new Map();
    const wb=k=>new RegExp('(^|[^a-z0-9])'+k.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(n);
    const roleHits=[...new Set(ROLES.flatMap(r=>r.kw.map(k=>k.trim())))].filter(wb);
    roleHits.filter(k=>!roleHits.some(o=>o!==k && o.includes(k))).forEach(k=>set.set(k,99));
    const toks=n.replace(/[^a-z0-9+#\-\s]/g,' ').split(/\s+/).filter(w=>w.length>3 && !STOP.has(w) && !/^\d+$/.test(w));
    const freq={}; toks.forEach(w=>freq[w]=(freq[w]||0)+1);
    Object.entries(freq).sort((a,b)=>b[1]-a[1]).forEach(([w,c])=>{ if(![...set.keys()].some(k=>k.includes(w))) set.set(w,c); });
    return [...set.keys()].slice(0,24);
  }
  function keywordMatch(text, kws){
    const n=' '+norm(text).replace(/[^a-z0-9+#\-\s]/g,' ').replace(/\s+/g,' ')+' ';
    const found=[], missing=[];
    kws.forEach(k=>{ const kk=k.trim(); const esc=kk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re = kk.length<=3 ? new RegExp(' '+esc+'(?=[^a-z0-9+#])') : new RegExp(' '+esc);
      (re.test(n) ? found : missing).push(kk); });
    return {found, missing, ratio: kws.length? found.length/kws.length : 0};
  }
  function roleFit(text){
    return ROLES.map(r=>{const m=keywordMatch(text,r.kw); return {id:r.id,name:r.name,pct:Math.round(Math.min(1,m.ratio/0.45)*100),found:m.found};})
      .sort((a,b)=>b.pct-a.pct);
  }
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const rewriteHint = l => {
    const s=stripBullet(l);
    if(isWeak(l)) return 'Cambia el verbo débil por uno que diga qué hiciste tú (diseñé, construí, lideré, analicé) y agrega el resultado.';
    if(!isStrong(l) && !hasMetric(l)) return 'Empieza con un verbo de acción y termina con un número: cuántos, cuánto, en cuánto tiempo, qué porcentaje.';
    if(!isStrong(l)) return 'Empieza la línea con un verbo de acción en pasado (desarrollé, validé, reduje).';
    return 'Agrega una cifra que muestre el impacto: usuarios, %, tiempo ahorrado, muestras, premios.';
  };

  function common(text, expText, vacante, roleId){
    const bl=bulletLines(expText);
    const strong=bl.filter(isStrong), weak=bl.filter(isWeak), metric=bl.filter(hasMetric);
    const vRatio = bl.length? strong.length/bl.length : 0;
    const mRatio = bl.length? metric.length/bl.length : 0;
    let kws, kwSource;
    if(roleId==='general'){ kws=GENERAL.map(k=>k.trim()); kwSource='general'; }
    else { const r=ROLES.find(r=>r.id===roleId)||ROLES[0]; kws=r.kw.map(k=>k.trim()); kwSource=r.name; }
    const km=keywordMatch(text,kws);
    if(kwSource==='general'){ km.ratio = Math.min(1, km.found.length/8)*0.6; km.missing=[]; }
    km.found=km.found.map(k=>pretty(k,text)); km.missing=km.missing.map(k=>pretty(k,text));
    let vac=null;
    if((vacante||'').trim().length>40){
      const vk=vacancyKeywords(vacante); const vm=keywordMatch(text,vk);
      const src=vacante+'\n'+text;
      vac={kws:vk, ratio:vm.ratio, found:vm.found.map(k=>pretty(k,src)), missing:vm.missing.map(k=>pretty(k,src))};
    }
    const cl=cliches(text);
    const toRewrite = bl.filter(l=>!(isStrong(l)&&hasMetric(l))).sort((a,b)=>(isWeak(b)?1:0)-(isWeak(a)?1:0)).slice(0,5).map(l=>({line:stripBullet(l).slice(0,180), hint:rewriteHint(l)}));
    const kwLabel = kwSource==='vacante'?'Palabras clave de la vacante': kwSource==='general'?'Herramientas y habilidades concretas':'Palabras clave del puesto';
    const kwDetail = kwSource==='general' ? `${km.found.length} herramientas o habilidades concretas detectadas (ideal 8 o más)` : `${km.found.length} de ${kws.length} coinciden (${kwSource==='vacante'?'vacante pegada':kwSource})`;
    const kwRec = kwSource==='general'
      ? {t:'Nombra tus herramientas concretas', d:'Los filtros buscan nombres concretos: programas (Excel, Python, SolidWorks…), idiomas con nivel, certificaciones y metodologías. Pon en Habilidades las que de verdad manejas y menciónalas dentro de tus logros.'}
      : {t: kwSource==='vacante'?'Usa las palabras de la vacante':'Agrega las palabras clave del área', d:`Faltan: ${km.missing.slice(0,8).join(', ')}. Inclúyelas solo si son ciertas, idealmente dentro de una viñeta de experiencia y repetidas en Habilidades o Aptitudes.`};
    return {bl,strong,weak,metric,vRatio,mRatio,kws,kwSource,km,cl,toRewrite,fit:roleFit(text),kwLabel,kwDetail,kwRec,vac};
  }

  function auditCV({cv, vacante, roleId}){
    const c=common(cv, cv, vacante, roleId);
    const n=norm(cv);
    const words=(cv.match(/\S+/g)||[]).length;
    const secs=SECTIONS.map(s=>({k:s.k, ok:s.re.test(n)}));
    const email=/[\w.+-]+@[\w-]+\.[\w.]+/.test(cv);
    const link=/linkedin\.com|github\.com|https?:\/\//i.test(cv);
    const phone=/\+?\d[\d\s\-]{8,}/.test(cv);
    const vague=c.cl.filter(x=>!x.evidence);
    const crit=[
      {key:'verbos', label:'Verbos de acción', max:20, score: Math.round(20*clamp(c.vRatio/0.7,0,1) - Math.min(6,c.weak.length*2)),
        detail:`${c.strong.length} de ${c.bl.length} líneas empiezan con un verbo de acción${c.weak.length?` · ${c.weak.length} con verbo débil`:''}`},
      {key:'metricas', label:'Logros con números', max:20, score: Math.round(20*clamp(c.mRatio/0.45,0,1)),
        detail:`${c.metric.length} de ${c.bl.length} líneas tienen una cifra`},
      {key:'keywords', label: c.kwLabel, max:20, score: Math.round(20*clamp(c.km.ratio/0.6,0,1)), detail: c.kwDetail},
      {key:'cliches', label:'Sin frases vacías', max:15, score: clamp(15-vague.length*3,0,15),
        detail: vague.length? `${vague.length} frase(s) genérica(s) sin evidencia` : 'No encontré frases vacías sin respaldo'},
      {key:'estructura', label:'Estructura legible por ATS', max:15, score: Math.round(secs.filter(s=>s.ok).length*2 + (email?2.5:0) + ((link||phone)?2.5:0)),
        detail:`Secciones: ${secs.filter(s=>s.ok).map(s=>s.k).join(', ')||'ninguna detectada'}`},
      {key:'longitud', label:'Extensión', max:10, score: words>=300&&words<=800?10:(words>=180&&words<300)||(words>800&&words<=1100)?6:2,
        detail:`${words} palabras (ideal 300–800, una página para pregrado)`}
    ];
    crit.forEach(k=>k.score=clamp(k.score,0,k.max));
    const recs=[];
    if(crit[0].score<crit[0].max) recs.push({pts:crit[0].max-crit[0].score, t:'Empieza cada viñeta con un verbo de acción', d:`Solo ${Math.round(c.vRatio*100)}% de tus viñetas arranca con verbo fuerte. Un filtro ATS y un reclutador leen los primeros 3 o 4 palabras. Cambia "Participé en…" o "Encargada de…" por "Diseñé", "Construí", "Lideré", "Analicé".`});
    if(crit[1].score<crit[1].max) recs.push({pts:crit[1].max-crit[1].score, t:'Pon números a tus logros', d:'Usa la fórmula: verbo + qué hiciste + cómo + resultado medible. Ejemplo: "Construí un prototipo de oxímetro con Arduino que midió SpO₂ con error < 3 % frente a un equipo comercial en 20 voluntarios".'});
    if(crit[2].score<crit[2].max) recs.push({pts:crit[2].max-crit[2].score, ...c.kwRec});
    if(vague.length) recs.push({pts:crit[3].max-crit[3].score, t:'Cambia adjetivos por evidencia', d:`Escribiste "${vague.slice(0,3).map(v=>v.term).join('", "')}" sin prueba. En vez de decir que eres "proactiva", cuenta la vez que propusiste algo y qué pasó.`});
    const missingSecs=secs.filter(s=>!s.ok).map(s=>s.k);
    if(crit[4].score<crit[4].max) recs.push({pts:crit[4].max-crit[4].score, t:'Completa la estructura', d:`${missingSecs.length?`Agrega título claro para: ${missingSecs.join(', ')}. `:''}${!email?'Falta un correo. ':''}${!(link||phone)?'Agrega teléfono y link a LinkedIn o GitHub. ':''}Usa títulos estándar ("Experiencia", "Educación") para que el ATS los reconozca.`});
    if(crit[5].score<crit[5].max) recs.push({pts:crit[5].max-crit[5].score, t: words<300?'Tu CV se queda corto':'Recorta tu CV', d: words<300?'Agrega proyectos de clase, semilleros, monitorías o voluntariados con resultados. Para pregrado eso cuenta como experiencia.':'Deja lo más relevante para el puesto y quita tareas obvias. Una página basta en pregrado.'});
    return finish(crit, recs, c, {secs, words});
  }

  function auditLinkedIn({titular, acerca, experiencia, url, vacante, roleId}){
    const all=[titular,acerca,experiencia].join('\n');
    const c=common(all, experiencia, vacante, roleId);
    const tl=(titular||'').trim().length;
    const tn=norm(titular);
    const hasSep=/[|·•\/,]/.test(titular||'');
    const tk=keywordMatch(titular||'', c.kws).found.length;
    let tScore = tl===0?0: tl<40?6: tl<70?12: tl<=220?16:8;
    if(tl>=40 && tl<=220 && (hasSep || tk>=2)) tScore+=4;
    if(/^(estudiante|student)\b/.test(tn) && tk<1 && !hasSep) tScore-=4;
    const al=(acerca||'').trim().length;
    let aScore = al===0?0: al<300?5: al<800?12: al<=2600?17:12;
    const firstPerson=/\b(soy|me |mi |mis |he |i am|i'm|my )/.test(' '+norm(acerca)+' ');
    const cta=/(contact|escrib|hablemos|conversemos|reach out|email|correo|@)/.test(norm(acerca));
    if(al>0 && firstPerson) aScore+=2; if(al>0 && cta) aScore+=1;
    const u=(url||'').trim();
    const slug=(u.match(/linkedin\.com\/in\/([^\/?#\s]+)/i)||[])[1]||'';
    const uScore = !u?0 : !slug?1 : /\d{3,}|-[a-z0-9]{6,}$/i.test(slug)?2:5;
    const vague=c.cl.filter(x=>!x.evidence);
    const crit=[
      {key:'titular', label:'Titular', max:20, score:tScore, detail:`${tl} caracteres (ideal 70–220, LinkedIn corta en 220)`},
      {key:'acerca', label:'Acerca de', max:20, score:aScore, detail: al? `${al} caracteres${firstPerson?' · en primera persona':''}${cta?' · invita a contactar':''}` : 'Vacío'},
      {key:'verbos', label:'Verbos de acción en experiencia', max:15, score: Math.round(15*clamp(c.vRatio/0.7,0,1) - Math.min(4,c.weak.length*2)), detail:`${c.strong.length} de ${c.bl.length} descripciones empiezan con verbo de acción`},
      {key:'metricas', label:'Logros con números', max:15, score: Math.round(15*clamp(c.mRatio/0.45,0,1)), detail:`${c.metric.length} de ${c.bl.length} descripciones tienen una cifra`},
      {key:'keywords', label: c.kwLabel, max:15, score: Math.round(15*clamp(c.km.ratio/0.6,0,1)), detail: c.kwDetail},
      {key:'cliches', label:'Sin frases vacías', max:10, score: clamp(10-vague.length*2.5,0,10), detail: vague.length?`${vague.length} frase(s) genérica(s) sin evidencia`:'No encontré frases vacías sin respaldo'},
      {key:'url', label:'URL personalizada', max:5, score:uScore, detail: !u?'No pegaste tu link': uScore===5?`linkedin.com/in/${slug}`:`linkedin.com/in/${slug} tiene números o letras al azar`}
    ];
    crit.forEach(k=>k.score=clamp(Math.round(k.score),0,k.max));
    const recs=[];
    if(crit[0].score<20) recs.push({pts:20-crit[0].score, t:'Reescribe tu titular', d: tl===0?'Está vacío. Es lo primero que ve un reclutador en la búsqueda.' : `Fórmula: Rol o carrera | 2–3 áreas o herramientas | algo que te distinga. Ejemplo: "Estudiante de Ingeniería Biomédica | Prototipado y dispositivos médicos | SolidWorks · Python | Semillero bitt".${tl>220?' Además supera 220 caracteres y LinkedIn lo corta.':''}`});
    if(crit[1].score<20) recs.push({pts:20-crit[1].score, t:'Fortalece tu "Acerca de"', d: al===0?'No tienes "Acerca de". Escribe 3 párrafos cortos: quién eres y qué te mueve, qué has hecho con un logro concreto, y qué buscas más una forma de contactarte.' : `${al<800?'Es corto: apunta a 800–2.000 caracteres. ':''}${!firstPerson?'Escríbelo en primera persona. ':''}${!cta?'Cierra con qué buscas y cómo contactarte. ':''}Incluye palabras clave de tu área en las primeras dos líneas, que son las que se ven sin dar "ver más".`});
    if(crit[2].score<15) recs.push({pts:15-crit[2].score, t:'Describe tu experiencia con verbos de acción', d:'Cada cargo o proyecto debe tener 2–4 líneas que arranquen con verbo: "Diseñé…", "Coordiné…", "Validé…". Un cargo sin descripción es solo un título.'});
    if(crit[3].score<15) recs.push({pts:15-crit[3].score, t:'Cuantifica', d:'Agrega cifras: número de usuarios, muestras, prototipos, % de mejora, premios, horas de capacitación. Los números hacen que tu perfil salte en una lectura rápida.'});
    if(crit[4].score<15) recs.push({pts:15-crit[4].score, ...c.kwRec});
    if(vague.length) recs.push({pts:10-crit[5].score, t:'Cambia adjetivos por evidencia', d:`"${vague.slice(0,3).map(v=>v.term).join('", "')}" no dice nada sin un ejemplo. Muestra el logro y deja que el lector concluya que eres así.`});
    if(crit[6].score<5) recs.push({pts:5-crit[6].score, t:'Personaliza tu URL', d:'En tu perfil: "Editar perfil público y URL" → "Editar tu URL personalizada". Usa nombre-apellido, sin números. Queda más limpio en el CV.'});
    return finish(crit, recs, c, {});
  }

  function finish(crit, recs, c, extra){
    const total=Math.round(crit.reduce((a,k)=>a+k.score,0));
    let verdict= total>=75?{k:'pasa',t:'Pasa el filtro',d:'Un ATS lo dejaría pasar a revisión humana.'}: total>=55?{k:'duda',t:'En la cuerda floja',d:'Podría pasar, pero compite en desventaja.'}:{k:'descarte',t:'Probable descarte',d:'Un filtro automático lo dejaría por fuera antes de que una persona lo lea.'};
    // Encaje con la vacante: aparte del puntaje general
    let vacFit=null;
    if(c.vac){
      const r=c.vac.ratio, pct=Math.round(Math.min(1,r/0.6)*100), doc=extra.secs?'CV':'perfil';
      if(r>=0.6) vacFit={k:'pasa',pct,t:'Probablemente pasas el primer filtro',
        d:`Tu ${doc} menciona ${c.vac.found.length} de las ${c.vac.kws.length} cosas que pide la oferta. Un filtro automático te dejaría pasar a revisión humana${total<55?', aunque conviene mejorar cómo está escrito para que la persona que lo lea se quede contigo':''}.`};
      else if(r>=0.35) vacFit={k:'duda',pct,t:'Encajas a medias',
        d:`Te faltan varias cosas que pide la oferta (${c.vac.missing.slice(0,5).join(', ')}). Si las tienes, escríbelas tal cual las nombra la vacante. Si no, puedes aplicar, pero con expectativas realistas.`};
      else vacFit={k:'no',pct,t:'Por ahora no cumples con lo que piden',
        d:`De ${c.vac.kws.length} cosas que menciona la oferta, en tu ${doc} solo aparecen ${c.vac.found.length}. Si de verdad no tienes ${c.vac.missing.slice(0,4).join(', ')}, lo más probable es que el filtro te descarte, aunque tu ${doc} esté muy bien escrito. No es un juicio sobre ti: esta vacante todavía no es para ti. Mira abajo los puestos donde ya encajas.`};
    }
    recs.sort((a,b)=>b.pts-a.pts);
    return {total, verdict, crit, recs, vacFit, ...c, ...extra};
  }

  return {auditCV, auditLinkedIn, ROLES};
})();
</script>

async function pdfToText(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    pages.push({w:page.view[2], items:tc.items.filter(it=>it.str.trim()!=='' || it.str===' ')});
  }
  const toLines = items => { const out=[]; let lastY=null, line='';
    items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null && Math.abs(y-lastY)>3){ out.push(line); line=''; } line+=(line&&!line.endsWith(' ')&&!it.str.startsWith(' ')?' ':'')+it.str; lastY=y; });
    out.push(line); return out; };
  const flat = pages.flatMap(pg=>pg.items.map(i=>i.str)).join(' ');
  // El PDF de LinkedIn tiene una columna lateral (contacto, aptitudes, idiomas): la leemos aparte
  const isLinkedIn = /linkedin\.com\/in\//i.test(flat) && /\b(Contactar|Contact)\b/.test(flat);
  let main=[], side=[];
  pages.forEach(pg=>{
    if(isLinkedIn){
      const cut=pg.w*0.3;
      main.push(...toLines(pg.items.filter(i=>i.transform[4]>=cut)));
      side.push(...toLines(pg.items.filter(i=>i.transform[4]<cut)));
    } else main.push(...toLines(pg.items));
  });
  return [...main, ...side].map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
}
function splitLinkedInPdf(txt){
  const L=txt.split('\n').map(s=>s.trim()).filter(Boolean);
  const idx=re=>L.findIndex(l=>re.test(l));
  const iS=idx(/^(extracto|summary|acerca de|about)$/i);
  const iE=idx(/^(experiencia|experience)$/i);
  const iEd=idx(/^(educaci[oó]n|education)$/i);
  const acerca = iS>=0 ? L.slice(iS+1, iE>iS?iE:undefined).join('\n') : '';
  const experiencia = iE>=0 ? L.slice(iE+1, iEd>iE?iEd:undefined).join('\n') : txt;
  const um = txt.replace(/\s+/g,' ').match(/(?:www\.)?linkedin\.com\/in\/[A-Za-z0-9\-_%]+/i);
  let titular='';
  const end = iS>=0 ? iS : (iE>=0 ? iE : -1);
  if(end>1){
    const cand=L.slice(Math.max(0,end-4), end).filter(l=>l.length>15 && !/linkedin\.com|@|\(LinkedIn\)|^p[aá]gina|^page/i.test(l));
    const loc=/,\s*(colombia|bogot|medell|cali|distrito|estados unidos|united states|m[eé]xico|espa)/i;
    titular = (cand.filter(l=>!loc.test(l)).sort((x,y)=>y.length-x.length)[0]||'');
  }
  return {acerca, experiencia, url: um?um[0]:'', titular};
}

function Dropzone({mode,onPick,onDrop}){
  const [over,setOver]=useState(false);
  return <div onDragOver={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)}
    onDrop={e=>{e.preventDefault();setOver(false);onDrop(e.dataTransfer.files?.[0]);}}
    className={"rounded-2xl border-2 border-dashed p-4 sm:p-5 flex flex-col sm:flex-row gap-4 sm:items-center transition "+(over?'border-sky bg-accentsoft':'border-[#9CC3F2] bg-surface2')}>
    <div className="flex-1 min-w-0">
      <div className="font-extrabold text-bitt">{mode==='cv'?'Sube tu CV en PDF':'Sube tu perfil de LinkedIn en PDF'}</div>
      {mode==='cv'
        ? <p className="text-sm text-muted mt-0.5">Arrástralo aquí o búscalo en tu computador. Se analiza al instante.</p>
        : <ol className="text-sm text-muted mt-1 list-decimal pl-5 space-y-0.5">
            <li>Abre tu perfil en LinkedIn desde el computador.</li>
            <li>Toca <b className="text-fg">Recursos</b> (o <b className="text-fg">Más</b>) debajo de tu foto y elige <b className="text-fg">Guardar en PDF</b>.</li>
            <li>Arrastra ese PDF aquí.</li>
          </ol>}
    </div>
    <button onClick={onPick} className="shrink-0 rounded-xl bg-bitt text-white font-bold px-4 py-2.5 hover:brightness-110">Elegir archivo</button>
  </div>;
}

/* ===== Revisor de foto de perfil (todo en el navegador, sin IA) ===== */
function analyzePhoto(img){
  const W=img.naturalWidth, H=img.naturalHeight;
  const S=256, c=document.createElement('canvas'); c.width=S; c.height=S;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  // recorte cuadrado central, como lo muestra LinkedIn
  const side=Math.min(W,H), sx=(W-side)/2, sy=(H-side)/2;
  ctx.drawImage(img,sx,sy,side,side,0,0,S,S);
  const d=ctx.getImageData(0,0,S,S).data;
  const g=new Float32Array(S*S);
  for(let i=0;i<S*S;i++) g[i]=(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255;
  let sum=0; for(const v of g) sum+=v; const mean=sum/g.length;
  let vs=0; for(const v of g) vs+=(v-mean)**2; const std=Math.sqrt(vs/g.length);
  // nitidez: varianza del laplaciano
  let lap=[], ls=0; for(let y=1;y<S-1;y++) for(let x=1;x<S-1;x++){ const i=y*S+x; const v=(4*g[i]-g[i-1]-g[i+1]-g[i-S]-g[i+S])*255; lap.push(v); ls+=v; }
  const lm=ls/lap.length; let lv=0; for(const v of lap) lv+=(v-lm)**2; lv/=lap.length;
  // fondo: borde de la imagen vs centro
  const border=[], center=[]; const b=Math.round(S*0.12);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const v=g[y*S+x]; if(x<b||y<b||x>=S-b) border.push(v); const dx=x-S/2, dy=y-S*0.45; if(dx*dx+dy*dy<(S*0.22)**2) center.push(v); }
  const m=a=>a.reduce((p,q)=>p+q,0)/a.length, sd=a=>{const mm=m(a); return Math.sqrt(a.reduce((p,q)=>p+(q-mm)**2,0)/a.length);};
  const bstd=sd(border), bmean=m(border), cmean=m(center);
  const checks=[];
  const add=(ok,label,detail)=>checks.push({ok,label,detail});
  add(Math.min(W,H)>=400?'good':Math.min(W,H)>=200?'warn':'bad','Resolución', `${W}×${H} px. ${Math.min(W,H)>=400?'Suficiente para que se vea nítida.':'LinkedIn recomienda al menos 400×400 px; súbela en mejor calidad.'}`);
  const ar=W/H; add(ar>=0.9&&ar<=1.1?'good':'warn','Formato', ar>=0.9&&ar<=1.1?'Casi cuadrada: el recorte circular no te corta.':'No es cuadrada. LinkedIn la recorta en círculo; revisa en la vista previa que no se corte tu cara.');
  add(mean>=0.35&&mean<=0.78?'good':'warn','Luz', mean<0.35?'Se ve oscura. Toma la foto de frente a una ventana o con más luz.':mean>0.78?'Se ve muy clara o quemada. Baja un poco la exposición.':'Buena iluminación general.');
  add(std>=0.15?'good':std>=0.1?'warn':'bad','Contraste', std>=0.15?'Buen contraste.':'Se ve plana o lavada; la cara se pierde con el fondo.');
  add(lv>=120?'good':lv>=45?'warn':'bad','Nitidez', lv>=120?'Se ve enfocada.':'Parece borrosa o movida. Usa una foto enfocada en tu cara.');
  add(bstd<=0.14?'good':'warn','Fondo', bstd<=0.14?'Fondo limpio y parejo.':'El fondo tiene mucho detalle. Un fondo liso hace que tú resaltes.');
  add(Math.abs(cmean-bmean)>=0.06?'good':'warn','Separación del fondo', Math.abs(cmean-bmean)>=0.06?'Te distingues del fondo.':'Tu cara y el fondo tienen un tono parecido; busca un fondo que contraste contigo.');
  const pts={good:1,warn:0.5,bad:0}; const score=Math.round(100*checks.reduce((a,c)=>a+pts[c.ok],0)/checks.length);
  return {checks,score,preview:c.toDataURL('image/jpeg',0.85)};
}
function PhotoCheck(){
  const [res,setRes]=useState(null); const [err,setErr]=useState(''); const ref=useRef(null);
  const [manual,setManual]=useState({});
  function onFile(f){
    if(!f) return; setErr('');
    if(!/^image\//.test(f.type)){ setErr('Sube una imagen (JPG o PNG).'); return; }
    const url=URL.createObjectURL(f); const img=new Image();
    img.onload=()=>{ try{ setRes(analyzePhoto(img)); }catch(e){ setErr('No pude leer esa imagen.'); } URL.revokeObjectURL(url); };
    img.onerror=()=>setErr('No pude abrir esa imagen.'); img.src=url;
  }
  const items=['Se te ve la cara completa y ocupa buena parte del círculo','Sales sola o solo, sin recortes de otras personas','Miras a la cámara o casi, con expresión amable','Ropa acorde a cómo te vestirías para una entrevista en tu área','Es reciente y te pareces a esa foto'];
  const tone={good:['bg-goodsoft','text-good','✓'],warn:['bg-warnsoft','text-warn','!'],bad:['bg-badsoft','text-bad','✕']};
  return <div className="border-t border-line pt-5 flex flex-col gap-3">
    <div className="flex items-start justify-between gap-3 flex-wrap">
      <div className="min-w-0"><div className="text-sm font-bold">Tu foto de perfil (opcional)</div>
        <p className="text-xs text-muted">No suma al puntaje. Reviso luz, nitidez, tamaño y fondo; lo demás lo marcas tú.</p></div>
      <button onClick={()=>ref.current?.click()} className="rounded-lg border border-line px-3 py-1.5 text-sm font-bold hover:border-sky">Subir foto</button>
      <input ref={ref} id="foto" type="file" accept="image/*" className="hidden" onChange={e=>{onFile(e.target.files?.[0]); e.target.value='';}}/>
    </div>
    {err && <div className="rounded-xl bg-badsoft text-bad text-sm px-3.5 py-2.5">{err}</div>}
    {res && <div className="flex flex-col sm:flex-row gap-4">
      <div className="shrink-0 flex flex-col items-center gap-2">
        <img src={res.preview} alt="Vista previa de tu foto recortada en círculo" className="w-28 h-28 rounded-full object-cover border-4 border-surface shadow-md"/>
        <span className="mono text-sm">{res.score}/100</span>
      </div>
      <ul className="flex-1 min-w-0 flex flex-col gap-1.5">
        {res.checks.map(c=><li key={c.label} className="flex gap-2 text-sm items-start">
          <span className={"shrink-0 w-5 h-5 rounded-full text-xs font-bold flex items-center justify-center "+tone[c.ok][0]+" "+tone[c.ok][1]}>{tone[c.ok][2]}</span>
          <span className="min-w-0"><b>{c.label}:</b> <span className="text-muted">{c.detail}</span></span></li>)}
      </ul>
    </div>}
    <div className="rounded-xl bg-surface2 p-3.5">
      <div className="text-xs font-bold uppercase tracking-[.08em] text-accent mb-1.5">Esto lo revisas tú</div>
      {items.map((it,i)=><label key={i} className="flex gap-2 items-start text-sm py-0.5 cursor-pointer">
        <input type="checkbox" id={'foto-'+i} className="mt-1 accent-[var(--bitt)]" checked={!!manual[i]} onChange={e=>setManual({...manual,[i]:e.target.checked})}/>
        <span>{it}</span></label>)}
    </div>
  </div>;
}

function Bar({value,max,tone}){
  const pct=Math.round(100*value/max);
  const col = tone || (pct>=75?'var(--good)':pct>=45?'var(--sun)':'var(--bad)');
  return <div className="h-2.5 w-full rounded-full bg-surface2 overflow-hidden" role="progressbar" aria-valuenow={value} aria-valuemin={0} aria-valuemax={max}>
    <div className="bar h-full rounded-full" style={{width:pct+'%', background:col}}/>
  </div>;
}

function Gauge({score, prev}){
  const r=54, C=2*Math.PI*r, off=C*(1-score/100);
  const col = score>=75?'var(--good)':score>=55?'var(--sun)':'var(--bad)';
  return <div className="relative w-[148px] h-[148px] shrink-0">
    <svg viewBox="0 0 140 140" className="w-full h-full -rotate-90">
      <circle cx="70" cy="70" r={r} fill="none" stroke="var(--surface-2)" strokeWidth="14"/>
      <circle cx="70" cy="70" r={r} fill="none" stroke={col} strokeWidth="14" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off} style={{transition:'stroke-dashoffset .8s'}}/>
    </svg>
    <div className="absolute inset-0 flex flex-col items-center justify-center">
      <span className="mono text-[44px] leading-none font-medium">{score}</span>
      <span className="text-xs text-muted mt-1">de 100</span>
      {prev!=null && prev!==score && <span className={"mono text-xs mt-1 font-medium "+(score>prev?'text-good':'text-bad')}>{score>prev?'▲ +':'▼ '}{score-prev} vs. antes</span>}
    </div>
  </div>;
}

function Field({id,label,hint,children,count,limit}){
  return <div className="flex flex-col gap-1.5">
    <div className="flex items-baseline justify-between gap-3">
      <label htmlFor={id} className="text-sm font-bold">{label}</label>
      {count!=null && <span className={"mono text-xs "+(limit&&count>limit?'text-bad':'text-muted')}>{count}{limit?` / ${limit}`:''}</span>}
    </div>
    {children}
    {hint && <p className="text-xs text-muted">{hint}</p>}
  </div>;
}
const inputCls="w-full rounded-xl border border-line bg-surface px-3.5 py-2.5 text-[14px] text-fg placeholder:text-muted focus:border-sky focus:outline-none";

function App(){
  const [mode,setMode]=useState('cv');
  const [cv,setCv]=useState(SAMPLE_CV);
  const [li,setLi]=useState(SAMPLE_LI);
  const [vacante,setVacante]=useState(SAMPLE_VACANTE);
  const [roleId,setRoleId]=useState('general');
  const [isSample,setIsSample]=useState(true);
  const [result,setResult]=useState(null);
  const [prev,setPrev]=useState(null);
  const [busy,setBusy]=useState('');
  const fileRef=useRef(null);

  function run(store, over){
    const c = over?.cv ?? cv, l = over?.li ?? li, sample = over ? false : isSample;
    const r = mode==='cv' ? Engine.auditCV({cv:c,vacante,roleId}) : Engine.auditLinkedIn({...l,vacante,roleId});
    const key='bitt-auditor-'+mode;
    const last=load(key);
    setPrev(last? last.total : null);
    setResult(r);
    if(store && !sample) save(key,{total:r.total, at:Date.now()});
    if(store) setTimeout(()=>document.getElementById('resultado')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
  }
  useEffect(()=>{ run(false); },[mode]);

  async function handleFile(f){
    if(!f) return;
    setBusy('Leyendo '+f.name+'…');
    try{
      const txt = f.type==='application/pdf' || /\.pdf$/i.test(f.name) ? await pdfToText(f) : await f.text();
      if(!txt.trim()) throw new Error('vacío');
      setIsSample(false);
      if(mode==='cv'){ setCv(txt); run(true,{cv:txt}); setBusy('Listo: analicé '+f.name+'. Si algo se ve raro, corrige el texto y vuelve a analizar.'); }
      else {
        const s=splitLinkedInPdf(txt);
        const nl={titular:s.titular, acerca:s.acerca, experiencia:s.experiencia, url:s.url};
        setLi(nl); run(true,{li:nl});
        setBusy('Listo: analicé '+f.name+'. Revisa que el titular haya quedado bien; si no, pégalo a mano y vuelve a analizar.');
      }
    }catch(err){ setBusy('No pude leer ese archivo. Si tu PDF es una imagen escaneada, copia y pega el texto.'); }
  }
  function onFile(e){ handleFile(e.target.files?.[0]); e.target.value=''; }
  function clearAll(){ setIsSample(false); setResult(null); if(mode==='cv') setCv(''); else setLi({titular:'',acerca:'',experiencia:'',url:''}); setVacante(''); setBusy(''); }

  const tab=(id,label,sub)=><button id={'tab-'+id} onClick={()=>{setMode(id); setBusy('');}} aria-pressed={mode===id}
    className={"flex-1 min-w-0 rounded-xl px-4 py-3 text-left transition "+(mode===id?'bg-bitt text-white shadow-md':'text-fg hover:bg-accentsoft')}>
    <div className="font-bold text-[15px]">{label}</div><div className={"text-xs "+(mode===id?'text-white/80':'text-muted')}>{sub}</div></button>;

  return <div className="min-h-full relative">
    {/* Ilustraciones de fondo */}
    <div aria-hidden="true" className="pointer-events-none fixed inset-0 overflow-hidden z-0">
      <img src={GEAR1} alt="" className="gear absolute -left-24 top-[38%] w-[300px] opacity-40"/>
      <img src={GEAR2} alt="" className="gear absolute -right-28 -bottom-24 w-[380px] opacity-40" style={{animationDirection:'reverse'}}/>
      <img src={GEAR1} alt="" className="gear absolute right-[30%] -top-24 w-[200px] opacity-25"/>
    </div>

    <header className="relative z-[1]">
      <div className="wrap max-w-6xl mx-auto pt-8 pb-4 relative">
        <img src={MOSAIC} alt="" aria-hidden="true" className="hidden lg:block absolute right-[max(16px,env(safe-area-inset-right,0px))] top-6 w-[270px] xl:w-[300px] h-auto drop-shadow-xl"/>
        <div className="flex items-center gap-4 flex-wrap">
          <img src={LOGO} alt="bitt" className="h-11 w-auto"/>
          <span className="text-xs font-bold uppercase tracking-[.14em] bg-sun text-[#0E1B3D] rounded-full px-3 py-1">Analizador IA para tu CV</span>
        </div>
        <p className="mt-2 text-xs font-bold uppercase tracking-[.12em] text-accent">Semillero de biodiseño, innovación y tecnología traslacional</p>
        <h1 className="mt-5 text-[32px] sm:text-[44px] leading-[1.05] font-extrabold tracking-tight text-bitt max-w-[620px]">Auditor de CV y LinkedIn</h1>
        <p className="mt-2 max-w-[620px] text-muted text-[16px]">Revisa tu hoja de vida o tu perfil como lo haría el filtro automático (ATS) de una empresa grande. Corrige, vuelve a subirlo y mira cuánto sube tu puntaje.</p>
        <div className="mt-6 flex gap-2 bg-surface border border-line shadow-sm p-1.5 rounded-2xl max-w-xl">
          {tab('cv','Auditoría de CV','Sube o pega tu hoja de vida')}
          {tab('li','Auditoría de LinkedIn','Sube el PDF de tu perfil')}
        </div>
      </div>
    </header>

    <main className="relative z-[1] wrap max-w-6xl mx-auto py-8 grid gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)] items-start">
      {/* Entrada */}
      <section className="bg-surface border border-line rounded-2xl p-5 sm:p-6 flex flex-col gap-5 min-w-0">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <h2 className="text-lg font-extrabold">{mode==='cv'?'Tu hoja de vida':'Tu perfil de LinkedIn'}</h2>
          <div className="flex gap-2">
            <button onClick={()=>fileRef.current?.click()} className="rounded-lg border border-line px-3 py-1.5 text-sm font-bold hover:border-sky">Subir PDF o .txt</button>
            <button onClick={clearAll} className="rounded-lg px-3 py-1.5 text-sm text-muted hover:text-fg">Borrar</button>
            <input ref={fileRef} id="file" type="file" accept=".pdf,.txt,application/pdf,text/plain" className="hidden" onChange={onFile}/>
          </div>
        </div>
        <Dropzone mode={mode} onPick={()=>fileRef.current?.click()} onDrop={handleFile}/>
        {isSample && <div className="rounded-xl bg-sunsoft text-sunfg text-sm px-3.5 py-2.5"><b>Esto es un ejemplo</b> para que veas cómo funciona. Bórralo y pon el tuyo.</div>}
        {busy && <div className="rounded-xl bg-accentsoft text-fg text-sm px-3.5 py-2.5">{busy}</div>}

        {mode==='cv' ? <Field id="cv" label="Texto de tu CV" hint="Copia todo el texto de tu CV (Ctrl+A, Ctrl+C) o sube el PDF. Nada sale de tu navegador." count={(cv.match(/\S+/g)||[]).length+' palabras'}>
            <textarea id="cv" rows={14} className={inputCls+" mono text-[13px] leading-relaxed"} value={cv} onChange={e=>{setCv(e.target.value);setIsSample(false);}} placeholder="Pega aquí tu hoja de vida…"/>
          </Field>
        : <>
          <Field id="titular" label="Titular" count={li.titular.length} limit={220} hint="La línea que aparece debajo de tu nombre.">
            <textarea id="titular" rows={2} className={inputCls} value={li.titular} onChange={e=>{setLi({...li,titular:e.target.value});setIsSample(false);}} placeholder="Ej.: Estudiante de Ingeniería Biomédica | Prototipado | Python"/>
          </Field>
          <Field id="acerca" label="Acerca de" count={li.acerca.length} limit={2600}>
            <textarea id="acerca" rows={5} className={inputCls} value={li.acerca} onChange={e=>{setLi({...li,acerca:e.target.value});setIsSample(false);}}/>
          </Field>
          <Field id="exp" label="Experiencia (y proyectos)" hint="Pega cada cargo con su descripción. Una línea por logro.">
            <textarea id="exp" rows={7} className={inputCls+" mono text-[13px]"} value={li.experiencia} onChange={e=>{setLi({...li,experiencia:e.target.value});setIsSample(false);}}/>
          </Field>
          <Field id="url" label="Link de tu perfil" hint="Solo con el link no puedo leer tu perfil, porque LinkedIn no deja que otras páginas lo lean. Con el link reviso si tu URL está personalizada; el contenido sale del PDF o de lo que pegues arriba.">
            <input id="url" className={inputCls} value={li.url} onChange={e=>{setLi({...li,url:e.target.value});setIsSample(false);}} placeholder="linkedin.com/in/tu-nombre"/>
          </Field>
          <PhotoCheck/>
        </>}

        <div className="border-t border-line pt-5 flex flex-col gap-4">
          <Field id="vacante" label="Vacante (opcional)" hint="El puntaje general no depende de la vacante. Si pegas una, te digo aparte si pasarías el primer filtro con las habilidades que tienes.">
            <textarea id="vacante" rows={4} className={inputCls} value={vacante} onChange={e=>setVacante(e.target.value)} placeholder="Pega aquí la descripción del cargo…"/>
          </Field>
          <Field id="rol" label="Área para la revisión general" hint="General sirve para cualquier carrera. Si eliges un área de biomédica, también reviso las palabras clave de esa área.">
            <select id="rol" className={inputCls} value={roleId} onChange={e=>setRoleId(e.target.value)}>
              <option value="general">General, sin un puesto específico (cualquier carrera)</option>
              {Engine.ROLES.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </Field>
        </div>
        <button id="analizar" onClick={()=>run(true)} className="rounded-xl bg-bitt text-white font-extrabold text-[16px] py-3.5 hover:brightness-110 active:translate-y-px">Analizar {mode==='cv'?'mi CV':'mi perfil'}</button>
      </section>

      {/* Resultado */}
      <section id="resultado" className="flex flex-col gap-5 min-w-0">
        {result && <Result r={result} prev={prev} mode={mode} isSample={isSample}/>}
      </section>
    </main>
    <footer className="relative z-[1] wrap max-w-6xl mx-auto pb-10 text-xs text-muted flex flex-col sm:flex-row gap-4 sm:items-center">
      <img src={STRIP} alt="" aria-hidden="true" className="w-[180px] h-auto rounded-lg shrink-0"/>
      <p className="min-w-0"><b className="text-fg">BITT</b> · Semillero de biodiseño, innovación y tecnología traslacional, Universidad de los Andes. El puntaje es una simulación con reglas fijas de lo que revisan los filtros ATS y los reclutadores: úsalo como guía, no como veredicto. Tu texto no se envía a ningún servidor.</p>
    </footer>
  </div>;
}

function Result({r,prev,mode,isSample}){
  const vTone={pasa:['bg-goodsoft','text-good'],duda:['bg-warnsoft','text-warn'],descarte:['bg-badsoft','text-bad']}[r.verdict.k];
  return <>
    <div className="bg-surface border border-line rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row gap-6 items-center">
      <Gauge score={r.total} prev={isSample?null:prev}/>
      <div className="flex-1 min-w-0 w-full">
        <span className={"inline-block rounded-full px-3 py-1 text-xs font-extrabold uppercase tracking-[.1em] "+vTone[0]+" "+vTone[1]}>{r.verdict.t}</span>
        <p className="mt-2 text-[15px]">{r.verdict.d}</p>
        <div className="mt-4 flex flex-col gap-3">
          {r.crit.map(k=><div key={k.key}>
            <div className="flex justify-between gap-3 text-sm"><span className="font-bold">{k.label}</span><span className="mono text-muted">{k.score}/{k.max}</span></div>
            <Bar value={k.score} max={k.max}/>
            <p className="text-xs text-muted mt-1">{k.detail}</p>
          </div>)}
        </div>
      </div>
    </div>

    {r.vacFit && (()=>{ const v=r.vacFit; const tone={pasa:['bg-goodsoft','text-good','var(--good)'],duda:['bg-warnsoft','text-warn','var(--sun)'],no:['bg-badsoft','text-bad','var(--bad)']}[v.k];
      return <div className="bg-surface border border-line rounded-2xl p-5 sm:p-6">
        <div className="flex items-start justify-between gap-4 flex-wrap">
          <div className="min-w-0">
            <h3 className="text-lg font-extrabold">Encaje con esta vacante</h3>
            <span className={"inline-block mt-1.5 rounded-full px-3 py-1 text-xs font-extrabold uppercase tracking-[.1em] "+tone[0]+" "+tone[1]}>{v.t}</span>
          </div>
          <div className="text-right"><span className="mono text-[34px] leading-none font-medium">{v.pct}%</span><div className="text-xs text-muted">de lo que piden</div></div>
        </div>
        <div className="mt-3"><Bar value={v.pct} max={100} tone={tone[2]}/></div>
        <p className="text-sm mt-3">{v.d}</p>
        <div className="mt-3 flex flex-wrap gap-1.5">
          {r.vac.found.map(k=><span key={'vf'+k} className="rounded-full bg-goodsoft text-good text-xs px-2.5 py-1 font-medium">✓ {k}</span>)}
          {r.vac.missing.map(k=><span key={'vm'+k} className="rounded-full border border-dashed border-line text-muted text-xs px-2.5 py-1">{k}</span>)}
        </div>
      </div>; })()}
    {r.recs.length>0 && <div className="bg-surface border border-line rounded-2xl p-5 sm:p-6">
      <h3 className="text-lg font-extrabold">Qué cambiar primero</h3>
      <p className="text-sm text-muted">Ordenado por cuántos puntos te hace ganar.</p>
      <ol className="mt-4 flex flex-col gap-3">
        {r.recs.map((x,i)=><li key={i} className="flex gap-3 rounded-xl bg-surface2 p-3.5">
          <span className="mono shrink-0 h-7 min-w-[44px] px-2 rounded-lg bg-sun text-[#0E1B3D] text-xs font-medium flex items-center justify-center">+{Math.round(x.pts)}</span>
          <div className="min-w-0"><div className="font-bold">{x.t}</div><p className="text-sm text-muted mt-0.5">{x.d}</p></div>
        </li>)}
      </ol>
    </div>}

    {r.toRewrite.length>0 && <div className="bg-surface border border-line rounded-2xl p-5 sm:p-6">
      <h3 className="text-lg font-extrabold">Líneas para reescribir</h3>
      <p className="text-sm text-muted">Fórmula: <b className="text-fg">verbo de acción + qué hiciste + cómo + resultado con número</b>.</p>
      <ul className="mt-4 flex flex-col gap-3">
        {r.toRewrite.map((x,i)=><li key={i} className="border-l-4 border-sun pl-3.5">
          <p className="mono text-[13px] break-words">“{x.line}”</p>
          <p className="text-sm text-muted mt-1">{x.hint}</p>
        </li>)}
      </ul>
    </div>}

    <div className="grid gap-5 sm:grid-cols-2">
      <div className="bg-surface border border-line rounded-2xl p-5 min-w-0">
        <h3 className="font-extrabold">{r.kwSource==='general'?'Habilidades detectadas':'Palabras clave'}</h3>
        <p className="text-xs text-muted">{r.kwSource==='vacante'?'Comparadas con la vacante': r.kwSource==='general'?'Herramientas y habilidades concretas que encontré':'Comparadas con "'+r.kwSource+'"'}</p>
        <div className="mt-3 flex flex-wrap gap-1.5">
          {r.km.found.map(k=><span key={'f'+k} className="rounded-full bg-goodsoft text-good text-xs px-2.5 py-1 font-medium">✓ {k}</span>)}
          {r.km.missing.map(k=><span key={'m'+k} className="rounded-full border border-dashed border-line text-muted text-xs px-2.5 py-1">{k}</span>)}
        </div>
      </div>
      <div className="bg-surface border border-line rounded-2xl p-5 min-w-0">
        <h3 className="font-extrabold">Puestos donde ya encajas</h3>
        <p className="text-xs text-muted">Según las palabras de tu {mode==='cv'?'CV':'perfil'}</p>
        <div className="mt-3 flex flex-col gap-2.5">
          {r.fit.slice(0,4).map(f=><div key={f.id}>
            <div className="flex justify-between text-sm gap-2"><span className="truncate">{f.name}</span><span className="mono text-muted">{f.pct}%</span></div>
            <Bar value={f.pct} max={100} tone="var(--sky)"/>
          </div>)}
        </div>
      </div>
    </div>

    {r.cl.length>0 && <div className="bg-surface border border-line rounded-2xl p-5 sm:p-6">
      <h3 className="font-extrabold">Frases genéricas detectadas</h3>
      <ul className="mt-3 flex flex-col gap-2">
        {r.cl.slice(0,6).map((c,i)=><li key={i} className="text-sm flex gap-2 items-start">
          <span className={"shrink-0 rounded-md px-2 py-0.5 text-xs font-bold "+(c.evidence?'bg-goodsoft text-good':'bg-badsoft text-bad')}>{c.evidence?'con evidencia':'vacía'}</span>
          <span className="min-w-0 break-words"><b>{c.term}</b> <span className="text-muted">en “{c.sentence}”</span></span>
        </li>)}
      </ul>
    </div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</html>
